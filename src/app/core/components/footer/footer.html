<footer class="footer">
  <div class="footer__inner container">
    <div class="footer__brand">
      <img class="footer__logo" src="/app-logo.webp" alt="" width="72" height="72" loading="lazy" />
      <div>
        <p class="footer__wordmark">{{ business.name }}</p>
        <p class="footer__tagline">
          {{ business.tagline }} · Craiova, din {{ business.foundedYear }}
        </p>
      </div>
    </div>

    <nav class="footer__nav" aria-label="Secțiuni">
      @for (section of sections; track section.id) {
        <button type="button" class="footer__link" (click)="goToSection(section.id)">
          {{ section.label }}
        </button>
      }
    </nav>

    <div class="footer__contact">
      <a class="footer__phone" [href]="'tel:' + business.phone">
        <app-icon name="phone" />
        {{ business.phoneDisplay }}
      </a>
      <a class="footer__address" [href]="business.mapsUrl" target="_blank" rel="noopener">
        {{ business.address.street }}, {{ business.address.city }}
      </a>
    </div>
  </div>

  <div class="footer__bottom container">
    <p class="footer__copy">
      © {{ year }} {{ business.company.legalName }} ·
      <a routerLink="/termeni-si-conditii" class="footer__legal">Termeni și condiții</a>
    </p>
    <button type="button" class="footer__top-btn" (click)="toTop()">
      Înapoi sus
      <app-icon name="arrow-up-right" />
    </button>
  </div>
</footer>
